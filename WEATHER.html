<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Weather Dashboard</h1>
        
        <!-- Search Bar -->
        <div class="flex gap-2 mb-6">
            <input type="text" id="city-input" placeholder="Enter city name..." class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
            <button id="search-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg font-semibold transition">Search</button>
        </div>

        <!-- Weather Display Card (Hidden by default until searched) -->
        <div id="weather-card" class="bg-slate-700 p-5 rounded-xl text-center hidden">
            <h2 id="city-name" class="text-xl font-semibold mb-1"></h2>
            <p id="temperature" class="text-4xl font-bold my-3 text-blue-400"></p>
            <p id="condition" class="capitalize text-slate-300 mb-4"></p>
            
            <div class="flex justify-around border-t border-slate-600 pt-4 text-sm text-slate-300">
                <span id="humidity"></span>
                <span id="wind-speed"></span>
            </div>
        </div>

        <!-- Error Message -->
        <p id="error-msg" class="text-red-400 text-center mt-4 hidden"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
